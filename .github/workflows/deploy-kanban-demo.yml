name: Deploy Kanban demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment workflow
        uses: actions/checkout@v4

      - name: Check out Kanban source
        env:
          KANBAN_REPOSITORY: OscarPallazhco/kanban
          KANBAN_BRANCH: feature/kanban-mvp-antigravity
        run: git clone --depth 1 --branch "$KANBAN_BRANCH" "https://github.com/$KANBAN_REPOSITORY.git" kanban-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanban-source/frontend/package-lock.json

      - name: Install Kanban dependencies
        working-directory: kanban-source/frontend
        run: npm ci

      - name: Configure static subpath export
        working-directory: kanban-source/frontend
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            basePath: "/kanban-demo",
            output: "export",
            images: { unoptimized: true },
          };

          export default nextConfig;
          EOF

      - name: Build Kanban demo
        working-directory: kanban-source/frontend
        run: npm run build

      - name: Check deployment secret
        id: deployment-secret
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [[ -n "$PAGES_DEPLOY_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Deployment unavailable::Add the PAGES_DEPLOY_TOKEN repository secret to publish the Kanban demo."
            exit 1
          fi

      - name: Check out GitHub Pages repository
        if: steps.deployment-secret.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: OscarPallazhco/OscarPallazhco.github.io
          ref: master
          path: pages
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          persist-credentials: false

      - name: Deploy only the Kanban route
        if: steps.deployment-secret.outputs.available == 'true'
        working-directory: pages
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          KANBAN_SHA="$(git -C ../kanban-source rev-parse HEAD)"
          test -f ../kanban-source/frontend/out/index.html
          mkdir -p kanban-demo .deploy-state
          rsync -a --delete ../kanban-source/frontend/out/ kanban-demo/
          printf '%s\n' "$KANBAN_SHA" > .deploy-state/kanban-demo-source.txt
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .nojekyll kanban-demo/ .deploy-state/kanban-demo-source.txt

          if git diff --cached --quiet; then
            echo "The Kanban demo is already up to date."
            exit 0
          fi

          git commit -m "Deploy OscarPallazhco/kanban@feature/kanban-mvp-antigravity (${KANBAN_SHA::7}) to /kanban-demo/"
          auth_header="$(printf 'x-access-token:%s' "$PAGES_DEPLOY_TOKEN" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" push origin HEAD:master
